<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Together 2026</title>
<!-- NATIVE-HEAD -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#14432F; --gold:#E2A93B; --red:#B3202E;
  --bg:#F4F7F3; --surface:#FFFFFF; --soft:#E8EEE9; --soft2:#D5E8DC;
  --ink:#13201A; --muted:#55615A; --line:#D3DCD5; --on-pine:#FFFFFF;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pine:#1E5A40; --bg:#0D1712; --surface:#15231B; --soft:#1C2E24; --soft2:#24443A;
    --ink:#E6EEE8; --muted:#A3B2A8; --line:#2C3F34;
  }
}
:root[data-theme="dark"]{
  --pine:#1E5A40; --bg:#0D1712; --surface:#15231B; --soft:#1C2E24; --soft2:#24443A;
  --ink:#E6EEE8; --muted:#A3B2A8; --line:#2C3F34;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
h2{font-size:1.25rem;margin:22px 0 10px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;max-width:640px;margin:0 auto}
header.top h1{font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{border:0;background:var(--soft);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .in{display:flex;width:100%;max-width:640px}
nav.bar button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button span{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav.bar button.on{color:var(--ink);font-weight:700}
nav.bar button.on span{filter:none;opacity:1}
.hero{background:var(--pine);color:var(--on-pine);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;margin-top:4px}
.hero svg{width:96px;height:120px;flex:none}
.hero .big{font-family:var(--serif);font-size:56px;line-height:1;color:var(--gold);font-weight:700}
.hero .cap{font-weight:600;font-size:1.05rem}
.hero p{margin:6px 0 0;font-size:.85rem;opacity:.85}
.field,.search input,select.field,textarea.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.field:focus,.search input:focus{border-color:var(--pine);box-shadow:0 0 0 2px color-mix(in srgb,var(--pine) 30%,transparent)}
.search{margin:14px 0 10px}
label.l{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--soft2);border-color:var(--pine);font-weight:600}
select.chip{appearance:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tile{border:0;background:var(--soft);border-radius:16px;padding:14px;text-align:left;display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem;cursor:pointer;min-height:70px}
.tile span{font-size:26px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.fcard{flex:none;width:200px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:left;padding:0}
.fcard .em{height:76px;background:var(--soft2);display:grid;place-items:center;font-size:36px}
.fcard .b{padding:10px 12px}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;width:100%;text-align:left}
.row .em{font-size:28px;line-height:1}
.row .t{font-weight:700}
.muted{color:var(--muted)} .fine{font-size:.82rem;color:var(--muted)}
.small{font-size:.85rem}
.demo{display:inline-block;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.02em}
.badge{display:inline-block;background:var(--soft);color:var(--muted);font-size:11px;padding:2px 6px;border-radius:4px}
.btn{border:0;background:var(--pine);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;cursor:pointer}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.tonal{background:var(--soft2);color:var(--ink)}
.btn.danger{background:var(--red)}
.btn.block{width:100%;margin-top:12px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.info{display:flex;gap:10px;padding:6px 0;font-size:.95rem}
.banner{height:130px;border-radius:18px;background:var(--soft2);display:grid;place-items:center;font-size:60px;margin-top:4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg);z-index:4}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px 14px}
.stat.on{background:var(--soft2)}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem}
.hugenum{font-family:var(--serif);font-size:64px;color:var(--pine);font-weight:700;line-height:1}
:root[data-theme="dark"] .hugenum{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hugenum{color:var(--gold)}}
.day{font-family:var(--serif);font-weight:700;margin:16px 0 4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;background:var(--soft)}
.photos{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.photos img{width:80px;height:80px;object-fit:cover;border-radius:10px;flex:none}
.bigphoto{width:100%;border-radius:14px;margin:6px 0;background:var(--soft)}
.budrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem;cursor:pointer}
.budrow.head{font-weight:700;cursor:default;color:var(--muted);font-size:.78rem}
.over{color:var(--red);font-weight:700}
.totals{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft2);border-radius:16px;padding:14px;gap:6px}
.totals b{display:block;font-size:1.05rem}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--pine)}
.check span{flex:1}
.check .done{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
.progress{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;cursor:pointer;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.card .em{font-size:34px}
.card h3{font-size:1.15rem}
.preview{width:100%;aspect-ratio:1080/1350;border-radius:16px;background:var(--soft);display:block;object-fit:contain}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0}
.sw input{width:22px;height:22px;accent-color:var(--pine)}
.counter{display:flex;align-items:center;gap:8px;padding:6px 0}
.counter span{flex:1}
.counter button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.counter b{width:40px;text-align:center}
.empty{text-align:center;padding:36px 20px}
.empty svg{width:60px;height:76px;opacity:.7}
.empty h3{margin:10px 0 6px;font-size:1.2rem}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .body{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--gold);color:#2B1D00;border:0;border-radius:18px;padding:14px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
/* ---------- Festive dashboard ---------- */
body.festive{
  --bg:#2A0710; --surface:rgba(255,248,236,.06); --soft:rgba(255,236,200,.09); --soft2:rgba(255,200,90,.18); --ink:#FFF6E6; --muted:#E9CFC0; --line:rgba(255,215,140,.22); --pine:#1E8A50; --gold:#FFC94A; --red:#E3263A;
  background-color:#2A0710;
  background-image:
    radial-gradient(1100px 700px at 50% -15%, rgba(255,201,74,.30), transparent 60%),
    radial-gradient(900px 700px at -20% 60%, rgba(227,38,58,.45), transparent 60%),
    radial-gradient(900px 700px at 120% 75%, rgba(30,138,80,.55), transparent 60%),
    linear-gradient(180deg,#6A0C1C 0%,#430915 38%,#1D3A22 78%,#0E2A18 100%);
  background-attachment:fixed;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body.festive main,body.festive header.top{position:relative;z-index:1}
body.festive select.field option,body.festive select.chip option{background:#3A0A14;color:#FFF6E6}
body.festive header.top{background:linear-gradient(180deg,rgba(60,6,18,.85),rgba(60,6,18,.35));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.festive header.top h1{background:linear-gradient(90deg,#FFE7A3,#FFC94A,#FFF1C9,#FFC94A);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shimmer 6s linear infinite}
body.festive .icon{background:rgba(255,215,140,.16);border:1px solid rgba(255,215,140,.35)}
body.festive nav.bar{background:rgba(48,6,16,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,201,74,.35)}
body.festive nav.bar button{color:#E9CFC0}
body.festive nav.bar button.on{color:#FFC94A}
body.festive .tabs{background:rgba(48,6,16,.92)}
body.festive .sheet .body{background:linear-gradient(180deg,#4A0B18,#2A0710);border-top:2px solid #FFC94A}
@keyframes shimmer{to{background-position:-200% 0}}
/* gift-tag cards: cream paper with dark ink */
body.festive .tile,body.festive .row,body.festive .card,body.festive .fcard{--ink:#2B1410;--muted:#6E5148;--pine:#17663A;--soft:#F6E7CF;--soft2:#F3D9A8;
  background:linear-gradient(160deg,#FFFBF2,#FBEFD9);color:#2B1410;border:1px solid #E9C67A;box-shadow:0 6px 18px rgba(20,0,5,.35),inset 0 0 0 3px rgba(255,255,255,.6)}
body.festive .tile{position:relative;overflow:hidden;font-weight:700;transition:transform .18s,box-shadow .18s}
body.festive .tile::after{content:'';position:absolute;right:-18px;top:-18px;width:46px;height:46px;background:linear-gradient(135deg,#E3263A,#A50E22);transform:rotate(45deg);opacity:.9}
body.festive .tile:nth-child(3n+2)::after{background:linear-gradient(135deg,#1E8A50,#0F5A31)}
body.festive .tile:nth-child(3n)::after{background:linear-gradient(135deg,#FFC94A,#D99A12)}
body.festive .tile:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 12px 26px rgba(20,0,5,.45),0 0 0 2px #FFC94A}
body.festive .tile span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:radial-gradient(circle at 35% 30%,#FF6B7A,#C3142A);box-shadow:0 3px 8px rgba(160,10,30,.4)}
body.festive .tile:nth-child(3n+2) span{background:radial-gradient(circle at 35% 30%,#4CD483,#167A43);box-shadow:0 3px 8px rgba(20,120,60,.4)}
body.festive .tile:nth-child(3n) span{background:radial-gradient(circle at 35% 30%,#FFE08A,#E3A21B);box-shadow:0 3px 8px rgba(200,140,20,.4)}
body.festive .fcard .em{background:linear-gradient(135deg,#C3142A 0%,#7A0A1E 50%,#167A43 100%)}
body.festive .banner{background:radial-gradient(circle at 50% 40%,rgba(255,201,74,.45),transparent 60%),linear-gradient(135deg,#C3142A,#6A0C1C 55%,#167A43);border:1px solid rgba(255,201,74,.5)}
body.festive .field,body.festive .search input{background:rgba(255,248,236,.95);color:#2B1410;border:1px solid #E9C67A}
body.festive .field::placeholder,body.festive .search input::placeholder{color:#9A7F72}
body.festive h2{color:#FFE7A3}
body.festive.snowy h2::before{content:'✦ ';color:#FFC94A}
body.festive .chip{background:rgba(255,248,236,.12);border-color:rgba(255,215,140,.4);color:#FFF6E6}
body.festive .chip.on{background:#FFC94A;color:#3A0A14;border-color:#FFC94A}
body.festive .btn{background:linear-gradient(135deg,#F0354A,#B10F25);color:#fff;border:1px solid rgba(255,201,74,.6);box-shadow:0 6px 18px rgba(177,15,37,.45)}
body.festive .btn.outline{background:rgba(255,248,236,.08);color:#FFF6E6;border:1px solid rgba(255,215,140,.45);box-shadow:none}
body.festive .btn.tonal{background:linear-gradient(135deg,#FFD66B,#F2AE22);color:#3A0A14;border:0;box-shadow:0 4px 14px rgba(242,174,34,.35)}
body.festive .row .btn.outline,body.festive .card .btn.outline{color:#2B1410;border-color:#D9B467}
body.festive a{color:#FFD66B}
body.festive .row a,body.festive .card a{color:#A50E22}
body.festive .hugenum{color:#FFC94A}
body.festive .progress i{background:linear-gradient(90deg,#E3263A,#FFC94A,#1E8A50)}
body.festive .trad{background:rgba(255,201,74,.10);border-left-color:#FFC94A}
body.festive .fab{background:linear-gradient(135deg,#FFD66B,#F2AE22);color:#3A0A14;box-shadow:0 8px 24px rgba(242,174,34,.45)}
body.festive .stat{background:rgba(255,248,236,.1)}
/* hanging ornaments */
.ornaments{display:flex;justify-content:space-around;height:78px;margin:-6px 4px -14px;pointer-events:none;position:relative;z-index:2}
.ornaments .o{transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite alternate}
.ornaments .o:nth-child(2n){animation-duration:2.6s;animation-delay:-.8s}
.ornaments .o:nth-child(3n){animation-duration:3.8s;animation-delay:-1.4s}
.ornaments svg{display:block}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* hero */
.hero{position:relative;overflow:hidden;cursor:pointer;background:
    radial-gradient(circle at 22% 45%, rgba(255,201,74,.45), transparent 38%),
    radial-gradient(circle at 100% 0%, rgba(255,255,255,.18), transparent 40%),
    linear-gradient(135deg,#D5172E 0%,#9C0C22 45%,#5E0A18 100%);
  padding-top:38px;border:2px solid #FFC94A;box-shadow:0 18px 44px rgba(10,0,3,.55),0 0 0 6px rgba(255,201,74,.12),0 0 40px rgba(255,201,74,.25)}

.hero::after{content:'';position:absolute;top:50%;left:0;right:0;height:14px;margin-top:6px;background:linear-gradient(180deg,#E8B33A,#FFE9A8,#E8B33A);opacity:.0}
.hero .hero-txt{position:relative;z-index:1}
.hero svg.garland{position:absolute;top:0;left:0;width:100%;height:34px;z-index:2}
.hero > svg:not(.garland):not(.snowcap){filter:drop-shadow(0 0 12px rgba(255,201,74,.9));animation:glow 2.4s ease-in-out infinite alternate;position:relative;z-index:1}
@keyframes glow{from{filter:drop-shadow(0 0 6px rgba(255,201,74,.6))}to{filter:drop-shadow(0 0 18px rgba(255,220,120,1))}}
.hero .snow-dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 15% 70%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 80% 35%,rgba(255,255,255,.65),transparent),radial-gradient(2px 2px at 60% 85%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 92% 75%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 40% 25%,rgba(255,255,255,.45),transparent)}
.hero .big{font-size:64px;background:linear-gradient(180deg,#FFF3C4 0%,#FFC94A 55%,#E39A14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(90,10,20,.6)) drop-shadow(0 0 14px rgba(255,201,74,.55))}
.hero .cap{font-size:1.15rem;letter-spacing:.2px}
.hero .pasko{font-family:var(--serif);font-style:italic;color:#FFE7A3;font-size:.95rem;margin-bottom:2px}
.hero .tap{display:inline-block;margin-top:8px;font-size:.78rem;background:rgba(255,201,74,.2);border:1px solid rgba(255,201,74,.5);border-radius:999px;padding:3px 10px;color:#FFE7A3}
.bulb{animation:twinkle 1.1s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:1;filter:drop-shadow(0 0 4px currentColor)}to{opacity:.35}}
.trad{background:var(--soft);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0}
.trad h3{font-size:1.05rem;margin-bottom:4px}
.trad p{margin:0 0 6px;font-size:.93rem}
/* splash */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#FFF6E6;
  background:radial-gradient(circle at 50% 38%,rgba(255,201,74,.45),transparent 42%),radial-gradient(900px 600px at 0% 100%,rgba(30,138,80,.6),transparent 60%),radial-gradient(900px 600px at 100% 100%,rgba(227,38,58,.55),transparent 60%),linear-gradient(180deg,#5E0A18,#2A0710 60%,#0E2A18);transition:opacity .7s,transform .7s}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .star{width:170px;height:214px;animation:float 3s ease-in-out infinite alternate;filter:drop-shadow(0 0 24px rgba(255,201,74,.9))}
#splash .star .rays{transform-origin:50px 44px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
#splash h1{font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.05;margin:10px 0 4px;font-style:italic;background:linear-gradient(90deg,#FFE7A3,#FFC94A,#FFF6D8,#FFC94A,#FFE7A3);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
#splash .sub{font-size:1.05rem;opacity:.95;letter-spacing:.3px}
#splash .count{margin:14px 0 22px;font-family:var(--serif);font-size:1.25rem;color:#FFE7A3}
#splash .count b{font-size:2rem;color:#FFC94A}
#splash .go{border:2px solid #FFE7A3;background:linear-gradient(135deg,#F0354A,#B10F25);color:#fff;font-weight:700;font-size:1.1rem;padding:15px 30px;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px rgba(177,15,37,.6),0 0 30px rgba(255,201,74,.35);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res => { try { const r = indexedDB.open('ct26-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch(e) { res(null); } });

}
async function idbDo(mode, fn){ const db = await idb(); if (!db) return null; return new Promise(res => { try { const tx = db.transaction('p', mode); const req = fn(tx.objectStore('p')); tx.oncomplete = () => res(req ? req.result : true); tx.onerror = () => res(null); } catch(e) { res(null); } }); }
const putPhoto = (id, blob) => idbDo('readwrite', s => s.put(blob, id));

/* Re-encoding through a canvas resizes the photo and drops hidden location data. */
function compress(file, max = 1280){
  return new Promise(res => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => res(b), 'image/jpeg', 0.82); };
    img.onerror = () => { URL.revokeObjectURL(u); res(null); };
    img.src = u;
  });
}

/* ---------- Search (rule-based, no AI) ---------- */
function dist(a, l){const R=6371,r=x=>x*Math.PI/180;const dLat=r(l.lat-a[0]),dLng=r(l.lng-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(l.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const STOP = new Set(['christmas','near','for','the','and','with','this','weekend','in','at','of','me','to','under','around','best','some','pasko','family','kids']);
function search(q, cat, family, origin){
  let text = (q || '').toLowerCase(); const understood = [];
  const pm = text.match(/under\s*(?:₱|php|p)?\s*([\d,]+)/); let max = null;
  if (pm) { max = parseInt(pm[1].replace(/,/g, ''), 10); text = text.replace(pm[0], ' '); understood.push('up to ' + peso(max)); }
  const gm = text.match(/for\s+(\d+)/); if (gm) { understood.push('group of ' + gm[1]); text = text.replace(gm[0], ' '); }
  let city = Object.keys(CITIES).find(c => text.includes(c.toLowerCase()));
  let prov = !city && [...new Set(LISTINGS.map(l => l.prov))].find(p => text.includes(p.toLowerCase()));
  if (city) { understood.push('near ' + city); text = text.replace(city.toLowerCase(), ' '); }
  if (prov) { understood.push('in ' + prov); text = text.replace(prov.toLowerCase(), ' '); }
  const fam = family || /\b(family|kids)\b/.test(text); if (fam) understood.push('family-friendly');
  const tokens = text.split(/[^\p{L}\p{N}]+/u).filter(t => t.length >= 3 && !STOP.has(t));
  const center = origin || (city ? CITIES[city] : null);
  const list = LISTINGS
    .filter(l => inCat(l, cat)).filter(l => !fam || l.family)
    .filter(l => max == null || (l.price != null && l.price <= max))
    .filter(l => !prov || l.prov === prov)
    .map(l => { const hay = [l.name, l.desc, catOf(l.cat).label, ...(l.also || []).map(c => catOf(c) ? catOf(c).label : ''), (ACATS[l.acat] || [''])[0], l.city, l.prov, l.dates || '', l.schedule || ''].join(' ').toLowerCase(); return [l, tokens.filter(t => hay.includes(t)).length]; })
    .filter(([, s]) => !tokens.length || s > 0)
    .sort((a, b) => (b[1] - a[1]) || (center ? dist(center, a[0]) - dist(center, b[0]) : 0))
    .map(x => x[0]);
  return {list, understood};
}

function stats(){

  const uniq = arr => new Set(arr).size;
  const s = {

    parties: att.filter(a => a.cat === 'PARTY').length,
    reunions: att.filter(a => a.cat === 'REUNION').length,
    restaurants: uniq(A.filter(a => a.type === 'VISITED' && a.cat === 'RESTAURANT').map(a => a.listingName || a.title)),
    boughtFrom: uniq(A.filter(a => a.type === 'BOUGHT').map(a => a.listingName || a.location || a.title)),
    gifts: A.filter(a => a.gift).length,
    events: att.filter(a => ['EVENT','CONCERT','CHURCH'].includes(a.cat)).length,
    shows: A.filter(a => a.type === 'WATCHED').length,
    stays: A.filter(a => a.type === 'STAYED').length,
    family: A.filter(a => a.type === 'FAMILY' || a.cat === 'FAMILY').length,
    places: uniq(A.filter(a => a.type === 'VISITED' || a.type === 'STAYED').map(a => a.listingName || a.title)),
    spent: S.spending.reduce((t, e) => t + e.amount, 0),
    memories: A.reduce((t, a) => t + (a.photos || []).length, 0),
  };
  const pl = (n, one, many = one + 's') => n === 1 ? one : many;
  const ev = s.events + s.parties + s.reunions;
  s.sentence = `We visited ${s.places} ${pl(s.places,'place')}, attended ${ev} ${pl(ev,'event')}, shared ${s.family} family ${pl(s.family,'experience')} and created ${s.memories} ${pl(s.memories,'memory','memories')}.`;
  return s;
}

  {em:'🌟', t:'Parol', b:"From the Spanish farol, lantern. The first parols were rectangular white-paper lanterns lit by candles or coconut oil. The five-pointed star became standard in the American period, said to be first made in 1908 by Francisco Estanislao of Pampanga. Parols were carried in the Panunuluyan procession during Simbang Gabi and then hung at home. San Fernando, Pampanga, and Las Piñas are the main parol-making places.", src:'https://en.wikipedia.org/wiki/Parol', sn:'Wikipedia: Parol'},
  {em:'🐚', t:'Capiz lanterns', b:"A modern parol made from thin, glowing capiz (windowpane oyster) shells in place of bamboo and paper, often with LED lights. Makers in Pampanga, Manila and Laguna sell them for homes here and abroad.", src:'https://thebeat.asia/manila/nomads/explore/brighten-up-your-holidays-heres-where-to-find-the-best-parol-makers-in-the-philippines', sn:'The Beat Asia'},
  {em:'⭐', t:'Belen', b:"The belen (from Belén, Bethlehem) is the nativity scene of the Filipino Christmas home. Tarlac, the Belen Capital of the Philippines, has held Belenismo sa Tarlac since 2007, with giant belens on display until January 6, the Feast of the Three Kings.", src:'https://radar.ph/belenismo-sa-tarlac-2025-a-guide-to-the-belen-capital-of-the-philippineslifestyle-food-and-culture-fix/', sn:'Radar PH'},
  {em:'🐃', t:'Taka of Paete', b:"Papier-mache figures from Paete, Laguna. Artisan Maria Piday made them as light replacements for heavy wooden church angels that kept falling at Christmas. Classic figures are carabaos, horses and chickens.", src:'https://en.wikipedia.org/wiki/Taka_(paper_mache)', sn:'Wikipedia: Taka'},
  {em:'🕯️', t:'Simbang Gabi and Panunuluyan', b:"The nine-day dawn Mass novena before Christmas. The Panunuluyan pageant re-enacts Joseph and Mary searching for lodging, with lanterns lighting the way, which is where the parol tradition began.", src:'https://en.wikipedia.org/wiki/Parol', sn:'Wikipedia: Parol'}
];
function openTraditions(){
  openSheet(`<h2 style="margin-top:0">Filipino Christmas decorations</h2><p class="small muted">The history and traditions behind what we hang at home.</p>` +
    TRADITIONS.map(x => `<div class="trad"><h3>${x.em} ${esc(x.t)}</h3><p>${esc(x.b)}</p><a class="fine" href="${x.src}" target="_blank" rel="noopener">Source: ${esc(x.sn)}</a></div>`).join('') +
    `<button class="btn block" onclick="closeSheet();go('discover',{cat:'DECOR'})">🌟 Where to buy decorations</button>`);
}
const LIGHTS_SVG = (() => {
  const cols = ['#E2A93B','#D7263D','#3FA34D','#F4F1DE','#4A90D9'];
  let b = '';
  for (let i = 0; i < 13; i++) { const x = 12 + i * 31, y = 10 + Math.sin(i * 1.15) * 5 + (i % 2 ? 6 : 0); b += `<line x1="${x}" y1="${y - 2}" x2="${x}" y2="${y + 3}" stroke="#2B3A30" stroke-width="2"/><ellipse class="bulb" style="animation-delay:${(i % 4) * .4}s" cx="${x}" cy="${y + 9}" rx="4.5" ry="7" fill="${cols[i % 5]}"/>`; }
  return `<svg class="garland" viewBox="0 0 400 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8 Q 50 22 100 10 T 200 10 T 300 10 T 400 8" fill="none" stroke="#2B3A30" stroke-width="2"/>${b}</svg>`;

/* Snow and twinkling bokeh lights behind every screen */
(function fx(){
  const c = document.getElementById('fx'), x = c.getContext('2d'); let W, H, flakes = [], lights = [];
  const COLS = ['255,201,74', '255,77,94', '76,212,131', '255,246,230', '127,184,255'];
  function size(){ const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; c.width = W * r; c.height = H * r; x.setTransform(r, 0, 0, r, 0, 0);
    flakes = Array.from({length: Math.round(W * H / 9000)}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + .6, s: Math.random() * .6 + .25, d: Math.random() * 6.28}));
    lights = Array.from({length: 18}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 26 + 10, c: COLS[Math.floor(Math.random() * COLS.length)], p: Math.random() * 6.28, v: Math.random() * .02 + .008})); }
  function draw(){
    x.clearRect(0, 0, W, H);
    for (const l of lights) { l.p += l.v; const a = .10 + .10 * Math.sin(l.p); const g = x.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); g.addColorStop(0, `rgba(${l.c},${a + .08})`); g.addColorStop(1, `rgba(${l.c},0)`); x.fillStyle = g; x.beginPath(); x.arc(l.x, l.y, l.r, 0, 6.28); x.fill(); }
    x.fillStyle = 'rgba(255,255,255,.85)';
    for (const f of flakes) { f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .35; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } x.beginPath(); x.arc(f.x, f.y, f.r, 0, 6.28); x.fill(); }
    if (!reduceMotion && !document.hidden) requestAnimationFrame(draw); else if (!reduceMotion) setTimeout(() => requestAnimationFrame(draw), 500);
  }
  addEventListener('resize', size); size(); draw();
})();

/* Confetti burst */
function burst(n = 140){
  if (reduceMotion) { toast('🎉 Maligayang Pasko!'); return; }
  const c = document.getElementById('confetti'), x = c.getContext('2d'), r = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * r; c.height = H * r; x.setTransform(r, 0, 0, r, 0, 0);
  const cols = ['#FFC94A', '#E3263A', '#1E8A50', '#FFF6E6', '#FF7A8A', '#4CD483'];
  const ps = Array.from({length: n}, (_, i) => { const side = i % 2; return {x: side ? W * .1 : W * .9, y: H * .55, vx: (side ? 1 : -1) * (Math.random() * 7 + 3), vy: -(Math.random() * 12 + 7), w: Math.random() * 8 + 5, h: Math.random() * 5 + 3, a: Math.random() * 6.28, va: Math.random() * .3 - .15, c: cols[i % cols.length], star: Math.random() < .2}; });
  let t = 0;
  (function step(){
    x.clearRect(0, 0, W, H); t++;
    for (const p of ps) { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
      if (p.star) { x.font = '16px serif'; x.fillText('★', -6, 6); } else x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); }
    if (t < 170) requestAnimationFrame(step); else x.clearRect(0, 0, W, H);
  })();
  ring(.0);
}

/* Christmas music: "Jingle Bells" (James Lord Pierpont, 1857, public domain), synthesized with bells */
const MUSIC = {ctx: null, master: null, playing: false, timer: null};
function midiHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function ensureCtx(){ if (!MUSIC.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; MUSIC.ctx = new AC(); } if (MUSIC.ctx.state === 'suspended') MUSIC.ctx.resume(); return MUSIC.ctx; }
function bell(ctx, out, t, hz, dur, vol){
  [[1, 1], [2, .35], [3.01, .12], [4.2, .05]].forEach(([m, v]) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = hz * m;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.5, dur * 1.6) / m * 1.2); o.connect(g); g.connect(out); o.start(t); o.stop(t + 2.5); });
}
function bass(ctx, out, t, hz, dur){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = hz; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05); }
let NOISE = null;
function sleigh(ctx, out, t, vol){
  if (!NOISE) { NOISE = ctx.createBuffer(1, ctx.sampleRate * .3, ctx.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = NOISE; f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .14); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + .2);
}
function ring(delay){ const ctx = ensureCtx(); if (!ctx || !MUSIC.playing && delay !== 0) return; const out = MUSIC.master || ctx.destination; const t = ctx.currentTime + .02;
  [84, 88, 91, 96].forEach((m, i) => bell(ctx, out, t + i * .07, midiHz(m), .3, MUSIC.master ? .12 : .06)); }
function playSong(){
  const ctx = ensureCtx(); if (!ctx) return;
  stopSong(true);
  const comp = ctx.createDynamicsCompressor(), master = ctx.createGain(); master.gain.value = .5; master.connect(comp); comp.connect(ctx.destination); MUSIC.master = master;
  const A = [[71,1],[71,1],[71,2],[71,1],[71,1],[71,2],[71,1],[74,1],[67,1.5],[69,.5],[71,4]];
  const B1 = [[72,1],[72,1],[72,1.5],[72,.5],[72,1],[71,1],[71,1],[71,.5],[71,.5],[71,1],[69,1],[69,1],[71,1],[69,2],[74,2]];
  const B2 = [[72,1],[72,1],[72,1.5],[72,.5],[72,1],[71,1],[71,1],[71,.5],[71,.5],[74,1],[74,1],[72,1],[69,1],[67,4]];
  const mel = [...A, ...B1, ...A, ...B2], CH = [43,43,43,43,48,43,50,50,43,43,43,43,48,43,50,43], beat = .32, t0 = ctx.currentTime + .25;
  // intro: bell glissando
  [79, 83, 86, 91, 95].forEach((m, i) => bell(ctx, master, t0 + i * .08, midiHz(m), .4, .1));
  const s0 = t0 + .7; let t = s0;
  for (const [m, b] of mel) { bell(ctx, master, t, midiHz(m + 12), b * beat, .22); bell(ctx, master, t, midiHz(m), b * beat, .1); t += b * beat; }
  CH.forEach((r, i) => { const mt = s0 + i * 4 * beat; bass(ctx, master, mt, midiHz(r), beat * 1.8); bass(ctx, master, mt + 2 * beat, midiHz(r + 7), beat * 1.8); });
  for (let i = 0; i < 128; i++) sleigh(ctx, master, s0 + i * beat / 2, i % 2 ? .05 : .11);
  // final chord
  [55, 67, 71, 74, 79].forEach(m => bell(ctx, master, t + .05, midiHz(m + 12), 1.2, .09));
  MUSIC.playing = true; updateMusicBtn();
  MUSIC.timer = setTimeout(() => { MUSIC.playing = false; MUSIC.master = null; updateMusicBtn(); }, (t - ctx.currentTime + 2.5) * 1000);
}
function stopSong(silent){
  clearTimeout(MUSIC.timer);
  if (MUSIC.master && MUSIC.ctx) { const g = MUSIC.master.gain; g.cancelScheduledValues(MUSIC.ctx.currentTime); g.setValueAtTime(g.value, MUSIC.ctx.currentTime); g.linearRampToValueAtTime(0, MUSIC.ctx.currentTime + .4); const m = MUSIC.master; setTimeout(() => { try { m.disconnect(); } catch(e) {} }, 500); }
  MUSIC.master = null; MUSIC.playing = false; if (!silent) updateMusicBtn();
}
function toggleMusic(){ if (MUSIC.playing) stopSong(); else { playSong(); burst(80); } }
function updateMusicBtn(){ const b = document.getElementById('musicBtn'); if (b) b.textContent = MUSIC.playing ? '🔔' : '🎵'; }

/* ---------- Gift giving plan: inaanaks, friends, loved ones ---------- */
const GGROUPS = {INAANAK:['Inaanak','👶'], LOVED:['Loved one','❤️'], FAMILY:['Family','🏠'], FRIEND:['Friend','🤝'], WORK:['Office or work','💼'], OTHER:['Others','🎄']};
const GSTAT = ['TODO','BOUGHT','WRAPPED','GIVEN'];
const GSTAT_LB = {ITEM:{TODO:'To buy',BOUGHT:'Bought',WRAPPED:'Wrapped',GIVEN:'Given'}, CASH:{TODO:'To prepare',BOUGHT:'Cash ready',WRAPPED:'In envelope',GIVEN:'Given'}};
const GSTAT_EM = {TODO:'🛒',BOUGHT:'🛍️',WRAPPED:'🎀',GIVEN:'✅'};
let giftFilter = 'ALL';
function giftBadge(){ const g = S.gifts || []; if (!g.length) return ''; const d = g.filter(x => x.status === 'GIVEN').length; return `<small style="display:block;font-weight:600;font-size:.75rem;opacity:.75">${d} of ${g.length} given</small>`; }
function giftCost(g){ return g.cost != null && g.cost !== '' ? +g.cost : (+g.budget || 0); }
function giftsView(){
  const G = S.gifts, n = G.length, given = G.filter(g => g.status === 'GIVEN').length;
  const budget = G.reduce((t, g) => t + (+g.budget || 0), 0), spent = G.filter(g => g.status !== 'TODO').reduce((t, g) => t + giftCost(g), 0);
  const toBuy = G.filter(g => g.status === 'TODO');
  const counts = k => G.filter(g => g.group === k).length;
  const chips = [['ALL', `All (${n})`], ['SHOP', `🛒 Shopping list (${toBuy.length})`], ...Object.entries(GGROUPS).filter(([k]) => counts(k)).map(([k, [lb, em]]) => [k, `${em} ${lb} (${counts(k)})`])];
  let list;
  if (giftFilter === 'SHOP') {
    list = toBuy.length ? (() => { const by = {}; toBuy.forEach(g => (by[g.where || 'Anywhere'] = by[g.where || 'Anywhere'] || []).push(g));
      return Object.entries(by).map(([w, gs]) => `<h2>📍 ${esc(w)}</h2>` + gs.map(g => `<div class="check"><input type="checkbox" onchange="setGift('${g.id}','BOUGHT')" aria-label="Mark ${esc(g.idea || 'gift')} for ${esc(g.name)} as ${GSTAT_LB[g.kind].BOUGHT.toLowerCase()}"><span><b>${esc(g.kind === 'CASH' ? 'Cash gift (aguinaldo)' : (g.idea || 'Gift to choose'))}</b><br><span class="fine">For ${esc(g.name)} · ${GGROUPS[g.group][0]}${g.budget ? ' · ' + peso(g.budget) : ''}</span></span></div>`).join('')).join('') +
        `<button class="btn outline block" onclick="shareShopping()">Share shopping list</button>`; })()
      : empty('Shopping done!', 'Every gift on your list is bought or ready. Time to wrap!');
  } else {
    const shown = G.filter(g => giftFilter === 'ALL' || g.group === giftFilter);
    list = shown.length ? Object.keys(GGROUPS).map(k => { const gs = shown.filter(g => g.group === k); if (!gs.length) return '';
      const d = gs.filter(g => g.status === 'GIVEN').length;
      return `<h2>${GGROUPS[k][1]} ${GGROUPS[k][0]}${k === 'INAANAK' ? 's' : ''} <span class="fine" style="font-family:var(--sans)">${d} of ${gs.length} done</span></h2>` + gs.map(giftRow).join(''); }).join('')
      : empty('No gifts planned yet', 'Add your inaanaks, friends and loved ones, then plan a gift for each one.', 'Add a gift', 'editGift()');
  }
  return `<div class="banner art cathero" style="margin-top:12px">${scene('GIFTS', 'plan')}<span class="bchip big">🎁 My Gift Plan 2026</span></div><div class="totals" style="margin-top:12px"><div><b>${given}/${n}</b><span class="fine">Given</span></div><div><b>${peso(budget)}</b><span class="fine">Gift budget</span></div><div><b class="${spent > budget && budget ? 'over' : ''}">${peso(spent)}</b><span class="fine">Spent so far</span></div></div>
    <div class="progress"><i style="width:${n ? given / n * 100 : 0}%"></i></div>
    <div class="btns"><button class="btn" style="flex:1" onclick="editGift()">＋ Add gift</button><button class="btn tonal" onclick="editGift(null,'INAANAK')">👶 Add inaanaks</button></div>
    ${budget && (S.plans.GIFTS || 0) !== budget ? `<p class="fine">Your Budget tab plans ${peso(S.plans.GIFTS || 0)} for gifts. <a href="#" onclick="event.preventDefault();S.plans.GIFTS=${budget};persist();toast('Gifts budget set to ${peso(budget)}');render()">Use ${peso(budget)} instead</a></p>` : ''}
    <div class="chips scroll">${chips.map(([k, lb]) => `<button class="chip ${giftFilter === k ? 'on' : ''}" onclick="giftFilter='${k}';render()">${lb}</button>`).join('')}</div>
    ${list}
    <p class="fine">Marking a gift as bought adds it to your Gifts spending in the Budget tab. Your gift list stays on this device.</p>`;
}
function giftRow(g){
  const lb = GSTAT_LB[g.kind || 'ITEM'], done = g.status === 'GIVEN', i = GSTAT.indexOf(g.status), next = GSTAT[(i + 1) % GSTAT.length];
  return `<div class="row" style="cursor:default;display:block">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>${esc(g.name)}</b> <span class="gpill ${done ? 'done' : ''}">${done ? '✅ Done' : '⏳ Not yet'}</span>
      <div class="small">${g.kind === 'CASH' ? '💵 Cash gift (aguinaldo)' : '🎁 ' + esc(g.idea || 'Gift to choose')}${g.budget ? ' · ' + peso(g.budget) : ''}</div>
      ${g.where ? `<div class="fine">📍 ${esc(g.where)}</div>` : ''}${g.date ? `<div class="fine">🗓️ Give on ${dayMonth(g.date)}</div>` : ''}${g.notes ? `<div class="fine">${esc(g.notes)}</div>` : ''}</div>
      <button class="x" onclick="delGift('${g.id}')" aria-label="Remove ${esc(g.name)}">✕</button></div>
    <div class="gsteps">${GSTAT.map((s, k) => `<span class="${k <= i ? 'on' : ''}">${GSTAT_EM[s]} ${lb[s]}</span>`).join('')}</div>
    <div class="btns" style="margin-bottom:0">${done ? `<button class="chip" onclick="setGift('${g.id}','TODO')">Start over</button>` : `<button class="chip on" onclick="setGift('${g.id}','${next}')">Mark ${lb[next].toLowerCase()} →</button>`}<button class="chip" onclick="editGift('${g.id}')">Edit</button></div></div>`;
}
function setGift(id, st){
  const g = S.gifts.find(x => x.id === id); if (!g) return;
  g.status = st;
  if (st === 'TODO') { if (g.spendId) S.spending = S.spending.filter(e => e.id !== g.spendId); g.spendId = null; }
  else if (!g.spendId && giftCost(g) > 0) { g.spendId = uid(); S.spending.push({id:g.spendId, cat:'GIFTS', amount:giftCost(g), date:todayISO(), label:`Gift for ${g.name}`}); }
  persist();
  if (st === 'GIVEN') { burst(90); toast(`🎉 Gift for ${g.name} given!`); } else if (st === 'BOUGHT') toast(`${GSTAT_LB[g.kind].BOUGHT}: ${g.name}`);
  render();
}
function delGift(id){ const g = S.gifts.find(x => x.id === id); if (!g) return; if (g.spendId) S.spending = S.spending.filter(e => e.id !== g.spendId); S.gifts = S.gifts.filter(x => x.id !== id); persist(); toast('Removed'); render(); }
function editGift(id, group){
  const g = id ? S.gifts.find(x => x.id === id) : {group: group || 'LOVED', kind: group === 'INAANAK' ? 'CASH' : 'ITEM', status:'TODO'};
  const places = [...new Set(LISTINGS.filter(l => ['GIFTS','DECOR','CHRISTMAS'].some(c => inCat(l, c))).map(l => l.name))];
  openSheet(`<h2 style="margin-top:0">${id ? 'Edit gift' : group === 'INAANAK' ? 'Add inaanaks' : 'Add a gift'}</h2>
    <label class="l" for="gf-n">${id ? 'Name' : 'Name or names'}</label><input class="field" id="gf-n" value="${esc(g.name || '')}" placeholder="${group === 'INAANAK' ? 'Miguel, Ella, Baby Joy' : 'Lola Cora'}">
    ${id ? '' : '<p class="fine" style="margin:4px 0 0">Separate names with commas to add several people with the same gift.</p>'}

const empty = (title, body, btn = '', fn = '') => `<div class="empty">${PAROL}<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p>${btn ? `<button class="btn" onclick="${fn}">${esc(btn)}</button>` : ''}</div>`;

/* ---------- Router ---------- */
let nav = {view:'home', params:{}}, stack = [];
const TABS = [['home','Home','🏠'],['discover','Discover','🔎'],['plan','Plan','🗓️'],['my','My Christmas','❤️'],['create','Create','✨']];
function go(view, params = {}){ stack.push(nav); nav = {view, params}; render(); scrollTo(0, 0); }
function tab(view, params = {}){ stack = []; nav = {view, params}; render(); scrollTo(0, 0); }
function back(){ nav = stack.pop() || {view:'home', params:{}}; render(); }
function render(){
  const v = VIEWS[nav.view](nav.params);
  $('#top').innerHTML = (stack.length && !TABS.some(t => t[0] === nav.view) ? `<button class="icon" onclick="back()" aria-label="Back">←</button>` : '') + `<h1>${esc(v.title)}</h1>` + (v.actions || '');
  document.body.classList.add('festive');
  document.body.classList.toggle('snowy', nav.view === 'home');
  $('#main').innerHTML = v.html;
  const cur = TABS.find(t => t[0] === nav.view) ? nav.view : null;
  $('#bar').innerHTML = TABS.map(([id, label, em]) => `<button class="${cur === id ? 'on' : ''}" onclick="tab('${id}')" ${cur === id ? 'aria-current="page"' : ''}><span>${em}</span>${label}</button>`).join('');
  if (v.after) v.after();
  hydrate();
}

function openSheet(html){ $('#sheetBody').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.remove('hidden'); hydrate(); }
function closeSheet(){ $('#sheet').classList.add('hidden'); pending = []; }
let confirmFn = null;
function confirmSheet(title, body, label, fn){ confirmFn = fn; openSheet(`<h2 style="margin-top:0">${esc(title)}</h2><p>${esc(body)}</p><div class="btns"><button class="btn danger" onclick="const f=confirmFn;closeSheet();f()">${esc(label)}</button><button class="btn outline" onclick="closeSheet()">Cancel</button></div>`); }

/* ---------- Sharing (native share, else copy) ---------- */
async function shareText(text){
  const SH = plugin('Share'); if (SH) { try { await SH.share({text, dialogTitle:'Share'}); return; } catch(e) { return; } }
  if (navigator.share) { try { await navigator.share({text}); return; } catch(e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into any app.'); }
  catch(e) { openSheet(`<h2 style="margin-top:0">Copy and send</h2><textarea class="field" rows="10" readonly>${esc(text)}</textarea>`); }
}

let disc = {};
function priceText(l){ if (l.admission) return l.admission; if (l.price === 0) return 'Free'; if (l.price) return 'From ' + peso(l.price); return 'Price: please verify with provider'; }
function vDiscover(p){
  if (!p._init) { disc = {q:p.q || '', cat:p.cat || null, family:false, origin:null, originLabel:null, note:null}; p._init = true; if (p.near) setTimeout(nearMe, 0); }
  return {title:'Discover', html:`
    <input class="field" type="search" value="${esc(disc.q)}" placeholder="Lights near Taguig, gifts under ₱1,000…" oninput="disc.q=this.value;renderResults()" aria-label="Search" style="margin-top:4px">
    <div class="chips scroll"><button class="chip ${!disc.cat ? 'on' : ''}" onclick="disc.cat=null;render()">All</button>${CATS.map(c => `<button class="chip ${disc.cat === c.id ? 'on' : ''}" onclick="disc.cat=disc.cat==='${c.id}'?null:'${c.id}';render()">${c.emoji} ${c.label}</button>`).join('')}</div>
    <div class="chips"><button class="chip ${disc.family ? 'on' : ''}" onclick="disc.family=!disc.family;render()">Family-friendly</button>
      <button class="chip" onclick="nearMe()">📍 ${disc.originLabel ? 'Near ' + esc(disc.originLabel) : 'Near me'}</button>
      <select class="chip" onchange="if(this.value){disc.origin=CITIES[this.value];disc.originLabel=this.value;disc.note=null;render()}" aria-label="Choose city"><option value="">Choose city</option>${Object.keys(CITIES).map(c => `<option ${disc.originLabel === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    ${disc.note ? `<p class="fine">${esc(disc.note)}</p>` : ''}
    ${disc.cat ? `<div class="banner art cathero">${scene(disc.cat, 'hero')}<span class="bchip big">${catOf(disc.cat).emoji} ${catOf(disc.cat).label}</span></div>` : ''}
    ${disc.cat === 'DECOR' ? `<button class="card" onclick="openTraditions()"><span class="em">📜</span><span><h3>Filipino decoration traditions</h3><span class="small muted">The story of the parol, belen, capiz lanterns and taka</span></span></button>` : ''}
    <div id="results"></div>`, after: renderResults};
}
function renderResults(){
  const el = $('#results'); if (!el) return;
  const r = search(disc.q, disc.cat, disc.family, disc.origin);
  el.innerHTML = (r.understood.length ? `<p class="fine">Showing: ${esc(r.understood.join(', '))}</p>` : '') +
    (r.list.length ? r.list.map(l => `<button class="row" onclick="go('listing',{id:'${l.id}'})"><div class="thumb">${thumb(l)}</div><div style="flex:1"><div class="fine" style="display:flex;justify-content:space-between;color:var(--pine);font-weight:600"><span>${catOf(l.cat).label}</span>${l.season === '2026' ? '<span class="badge" style="background:var(--soft2);color:var(--ink)">2026 dates</span>' : ''}</div><div class="t">${esc(l.name)}</div><div class="fine">${esc(l.city)}, ${esc(l.prov)}</div><div class="small">${esc(l.dates || '')}</div><div class="small muted">${esc(priceText(l))}${disc.origin ? ' · about ' + dist(disc.origin, l).toFixed(0) + ' km away' : ''}</div></div></button>`).join('')
      : empty('Nothing matches yet', 'We only list places we could confirm from a published source, so some categories are still filling up. Try another search, or suggest a place.', 'Clear filters', "disc.q='';disc.cat=null;disc.family=false;render()")) +
    `<div class="card" style="cursor:default"><span class="em">💡</span><span><b>Know a Christmas place or event?</b><br><span class="small muted">Suggest it and we'll check it before it's listed.</span><br><button class="btn tonal" style="margin-top:8px" onclick="openSuggest()">Suggest a place</button></span></div>`;
}
function nearMe(){
  if (!navigator.geolocation) { disc.note = 'Choose your city to see what is nearby.'; render(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { disc.origin = [pos.coords.latitude, pos.coords.longitude]; disc.originLabel = 'your location'; disc.note = null; render(); },
    () => { disc.note = 'Location is not available here. Choose your city instead.'; render(); },
    {timeout: 8000, maximumAge: 600000});
}

  const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(l.name + ', ' + l.city);
  const src = safeUrl(l.sourceUrl), note = seasonNote(l);
  return {title:l.name, html:`
    <div class="banner art">${scene(l.cat, l.id)}<span class="medal big">${thumb(l)}</span><span class="bchip">${catOf(l.cat).emoji} ${catOf(l.cat).label}</span></div>

let pending = [];
function activityFields(full, pre = {}){
  return `${full ? `<label class="l" for="f-title">What did you do?</label><input class="field" id="f-title" placeholder="Family dinner at home" value="${esc(pre.title || '')}">
    <label class="l" for="f-type">Type</label><select class="field" id="f-type">${Object.entries(ATYPES).map(([k, [lb, em]]) => `<option value="${k}" ${k === (pre.type || 'FAMILY') ? 'selected' : ''}>${em} ${lb}</option>`).join('')}</select>

    <label class="l" for="f-loc">Where (optional)</label><input class="field" id="f-loc">` : ''}

    <label class="l" for="f-people">With whom (optional)</label><input class="field" id="f-people" placeholder="Mama, Papa, Kuya">
    <label class="l" for="f-amount">Amount spent in ₱ (optional)</label><input class="field" id="f-amount" inputmode="decimal" placeholder="0">
    <div class="sw"><input type="checkbox" id="f-gift" onchange="$('#giftfor').style.display=this.checked?'block':'none'"><label for="f-gift">This was a gift</label></div>
    <div id="giftfor" style="display:none"><input class="field" id="f-giftfor" placeholder="Gift for, e.g. Mother"></div>
    <label class="l" for="f-notes">Notes (optional)</label><textarea class="field" id="f-notes" rows="2"></textarea>
    <label class="l" for="f-photos">Photos (optional)</label><input type="file" id="f-photos" accept="image/*" multiple onchange="addPending(this.files)">
    <div class="photos" id="pending"></div>
    <p class="fine">Photos stay in this browser on this device unless you choose to share them.</p>`;
}
async function addPending(files){
  for (const f of files) { const b = await compress(f); if (b) pending.push(b); }
  const el = $('#pending'); if (el) el.innerHTML = pending.map(b => `<img src="${URL.createObjectURL(b)}" alt="Selected photo">`).join('');
}
function openCapture(id, type){
  const l = byId(id); pending = [];
  openSheet(`<div class="fine" style="color:var(--pine);font-weight:700">${ATYPES[type][1]} ${ATYPES[type][0]}</div><h2 style="margin:4px 0 6px">${esc(l.name)}</h2>${activityFields(false)}<button class="btn block" onclick="saveActivity({type:'${type}',cat:'${l.acat}',title:${esc(JSON.stringify(l.name))},listingId:'${l.id}',listingName:${esc(JSON.stringify(l.name))},location:${esc(JSON.stringify(l.city + ', ' + l.prov))}})">Add to My Christmas</button>`);
}
async function saveActivity(base){
  const val = id => ($('#' + id) || {}).value || '';
  const a = Object.assign({id:uid(), type:'FAMILY', cat:'FAMILY', title:'', listingId:null, listingName:null, location:''}, base);
  if ($('#f-title')) { a.title = val('f-title').trim(); a.type = val('f-type'); a.cat = val('f-cat'); a.location = val('f-loc').trim(); }
  if (!a.title) { toast('Add a name for the activity.'); return; }
  a.date = val('f-date') || todayISO(); a.people = val('f-people').trim(); a.notes = val('f-notes').trim();
  a.amount = parseFloat(val('f-amount').replace(/,/g, '')) || null;
  a.gift = !!($('#f-gift') && $('#f-gift').checked); a.giftFor = a.gift ? val('f-giftfor').trim() : '';
  a.photos = []; a.created = Date.now();
  for (const b of pending) { const pid = 'p' + uid(); if (await putPhoto(pid, b)) a.photos.push(pid); }
  if (pending.length && a.photos.length < pending.length) toast('Some photos could not be stored on this device.');
  S.activities.push(a);
  if (a.amount > 0) S.spending.push({id:uid(), cat:budgetFor(a.cat, a.gift), amount:a.amount, date:a.date, label:a.title, activityId:a.id});
  if (a.listingId && S.saved[a.listingId]) S.saved[a.listingId].status = 'COMPLETED';
  persist(); closeSheet(); toast('Added to My Christmas 2026');
  if (nav.view === 'add') back(); else render();
}
function vAdd(){ if (!vAdd._fresh) pending = []; return {title:'Add activity', html: activityFields(true) + `<button class="btn block" onclick="saveActivity({})">Add to My Christmas</button>`}; }

async function addPhotosTo(aid, files){ const a = S.activities.find(x => x.id === aid); for (const f of files) { const b = await compress(f); const pid = 'p' + uid(); if (b && await putPhoto(pid, b)) a.photos.push(pid); } persist(); render(); }
async function deletePhotoFrom(aid, pid){ const a = S.activities.find(x => x.id === aid); a.photos = a.photos.filter(x => x !== pid); await delPhoto(pid); persist(); render(); }
async function deleteActivity(id){ const a = S.activities.find(x => x.id === id); for (const pid of (a.photos || [])) await delPhoto(pid); S.activities = S.activities.filter(x => x.id !== id); S.spending = S.spending.filter(e => e.activityId !== id); persist(); back(); }

const STAT = ['INTERESTED','PLANNED','COMPLETED'], STAT_LB = {INTERESTED:'Interested', PLANNED:'Planned', COMPLETED:'Completed'};
function vPlan(p){
  const t = p.t || 'saved';
  const tabs = `<div class="tabs" role="tablist">${[['saved','Saved'],['gifts','🎁 Gifts'],['budget','Budget'],['bucket','Bucket list']].map(([k, lb]) => `<button role="tab" class="${t === k ? 'on' : ''}" onclick="nav.params.t='${k}';render()">${lb}</button>`).join('')}</div>`;

    const items = Object.entries(S.saved).map(([id, s]) => [byId(id), s]).filter(x => x[0]);
    if (!items.length) body = empty('Nothing saved yet', 'Tap Save on any place or event to build your favorites and Christmas plan.', 'Discover places', "tab('discover')");
    else body = STAT.map(st => { const g = items.filter(x => x[1].status === st); return g.length ? `<h2>${STAT_LB[st]}</h2>` + g.map(([l, s]) => `<div class="row" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${catOf(l.cat).emoji} ${esc(l.name)}</b></div>

      <div class="btns" style="margin-bottom:0"><button class="chip on" onclick="cycleStatus('${l.id}')">${STAT_LB[s.status]} →</button><button class="chip" onclick="editSaved('${l.id}')">Date and notes</button><button class="chip" onclick="go('listing',{id:'${l.id}'})">Open</button><button class="x" onclick="delete S.saved['${l.id}'];persist();render()" aria-label="Remove">✕</button></div></div>`).join('') : ''; }).join('') + '<p class="fine">Tap the status to move it along: Interested, Planned, Completed.</p>';
  } else if (t === 'gifts') {
    body = giftsView(p);
  } else if (t === 'budget') {
    const actual = k => S.spending.filter(e => e.cat === k).reduce((t, e) => t + e.amount, 0);
    const tp = Object.keys(BUDGET).reduce((t, k) => t + (S.plans[k] || 0), 0), ta = S.spending.reduce((t, e) => t + e.amount, 0);
    body = `<div class="totals"><div><b>${peso(tp)}</b><span class="fine">Planned</span></div><div><b>${peso(ta)}</b><span class="fine">Spent</span></div><div><b class="${ta > tp && tp ? 'over' : ''}">${peso(tp - ta)}</b><span class="fine">Remaining</span></div></div>
      <button class="btn block" onclick="addSpending()">Add spending</button>
      <p class="fine">Tap a category to set its planned amount. Spending from activities is added automatically.</p>
      <div class="budrow head"><span>Category</span><span>Planned</span><span>Actual</span><span>Left</span></div>
      ${Object.entries(BUDGET).map(([k, lb]) => { const pl = S.plans[k] || 0, ac = actual(k); return `<div class="budrow" onclick="editPlan('${k}')" role="button" tabindex="0"><b>${lb}</b><span>${peso(pl)}</span><span>${peso(ac)}</span><span class="${ac > pl && pl ? 'over' : ''}">${peso(pl - ac)}</span></div>`; }).join('')}
      ${S.spending.length ? '<h2>Spending</h2>' + [...S.spending].reverse().map(e => `<div class="check"><span><b>${esc(e.label)}</b><br><span class="fine">${BUDGET[e.cat]}, ${prettyDate(e.date)}</span></span><b>${peso(e.amount)}</b><button class="x" onclick="S.spending=S.spending.filter(x=>x.id!=='${e.id}');persist();render()" aria-label="Delete">✕</button></div>`).join('') : ''}`;
  } else {
    const done = S.bucket.filter(b => b.done).length, n = S.bucket.length;
    body = `<h2 style="margin-top:12px">${done} of ${n} done</h2><div class="progress"><i style="width:${n ? done / n * 100 : 0}%"></i></div>

  }
  return {title:'My Christmas Plan', html: tabs + body};
}

    await this.request(CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/suggestions', {method:'POST', headers:Object.assign(this.headers(), {Prefer:'return=minimal'}), body:JSON.stringify(s)});
  },
  queue(){ try { return JSON.parse(localStorage.getItem('ct26-sugq') || '[]'); } catch(e) { return []; } },
  async flushSuggestions(){ const q = this.queue(); if (!q.length) return; const left = []; for (const s of q) { try { await this.postSuggestion(s); } catch(e) { left.push(s); } } try { localStorage.setItem('ct26-sugq', JSON.stringify(left)); } catch(e) {} }
};

/* ---------- Native helpers (Android app built with Capacitor) ---------- */
if (NATIVE) {
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="http"]'); if (!a) return; e.preventDefault(); const B = plugin('Browser'); if (B) B.open({url: a.href}); else window.open(a.href, '_system'); }, true);
  const AppP = plugin('App');
  if (AppP) AppP.addListener('backButton', () => { const sp = document.getElementById('splash'); if (sp) return; if (!$('#sheet').classList.contains('hidden')) { closeSheet(); return; } if (stack.length) { back(); return; } if (nav.view !== 'home') { tab('home'); return; } AppP.exitApp(); });
  if (AppP) AppP.addListener('pause', () => { if (MUSIC.playing) stopSong(); });
}
async function blobToBase64(b){ return new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(b); }); }
async function nativeShareFile(blob, name, text){
  const FS = plugin('Filesystem'), SH = plugin('Share'); if (!FS || !SH) return false;
  const w = await FS.writeFile({path: name, data: await blobToBase64(blob), directory: 'CACHE'});
  await SH.share({title: 'Christmas Together 2026', text, files: [w.uri], dialogTitle: 'Share your greeting'}); return true;
}

/* ---------- Live listings in Claude: shared database, updatable without a new app version ---------- */
let dbx = null, isAdmin = false;
function validRow(l){ return l && typeof l.name === 'string' && catOf(l.cat) && ACATS[l.acat] && typeof l.lat === 'number' && typeof l.lng === 'number'; }
(async () => {
  try {
    if (!(window.claude && window.claude.use)) { API.load(); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (user) { try { isAdmin = await user.canEdit(); } catch(e) {} }
    if (isAdmin && nav.view === 'settings') render();
    if (!db) return;
    dbx = db;
    db.collection('listings').onSnapshot(snap => {
      const rows = snap.docs.map(d => Object.assign({}, d.data(), {id: d.id})).filter(validRow);
      ALL_ROWS = rows;
      const live = rows.filter(l => l.status !== 'hidden');
      if (!live.length) return;
      LISTINGS = live; LIVE = true; API.source = 'claude'; API.updatedAt = Date.now();
      if (!$('#sheet').classList.contains('hidden')) return;
      if (nav.view === 'discover') renderResults();
      else if (['home','listing','admin','settings'].includes(nav.view)) render();
    }, () => {});
  } catch(e) {}
})();

function openSuggest(){
  openSheet(`<h2 style="margin-top:0">Suggest a place or event</h2>
    <p class="small muted">We check every suggestion against a published source before listing it.</p>
    <label class="l" for="sg-n">Name</label><input class="field" id="sg-n" placeholder="Barangay Christmas village">
    <label class="l" for="sg-c">City or town</label><input class="field" id="sg-c" placeholder="Antipolo">
    <label class="l" for="sg-w">What and when</label><textarea class="field" id="sg-w" rows="3" placeholder="Lights show every night from Dec 1"></textarea>
    <label class="l" for="sg-u">Link to a post or page (optional)</label><input class="field" id="sg-u" placeholder="https://">
    <button class="btn block" onclick="sendSuggestion()">Send suggestion</button>`);
}
async function sendSuggestion(){
  const n = $('#sg-n').value.trim(), c = $('#sg-c').value.trim();
  if (!n || !c) { toast('Add a name and a city.'); return; }
  const sug = {name:n.slice(0,200), city:c.slice(0,100), what:$('#sg-w').value.trim().slice(0,1000), url:$('#sg-u').value.trim().slice(0,500)};
  if (!dbx) {
    try { await API.postSuggestion(sug); closeSheet(); toast('Thanks! We will check it.'); }
    catch(e) { const q = API.queue(); q.push(sug); try { localStorage.setItem('ct26-sugq', JSON.stringify(q.slice(-20))); } catch(_) {} closeSheet(); toast(API.hasServer() ? 'Saved. It will be sent when you are online.' : 'Thanks! Saved on this device for now.'); }
    return;
  }
  try { await dbx.collection('suggestions').add({name:n.slice(0,200), city:c.slice(0,100), what:$('#sg-w').value.trim().slice(0,1000), url:$('#sg-u').value.trim().slice(0,500), at:Date.now()}); closeSheet(); toast('Thanks! We will check it.'); }
  catch(e) { toast('Could not send right now. Try again later.'); }
}

function vAdmin(){
  if (!isAdmin) return {title:'Manage listings', html: empty('Admins only', 'Only the app owner and editors can manage listings.')};
  const rows = ALL_ROWS || [];
  setTimeout(loadSuggestions, 0);
  return {title:'Manage listings', html:`
    <p class="small">${dbx ? `${rows.length} listings in the shared list. Changes show for everyone right away.` : 'The shared list is not available in this view. Open the app while signed in to edit.'}</p>
    ${dbx ? `<button class="btn block" onclick="go('admin_edit',{})">Add listing</button>` : ''}
    <h2>Suggestions</h2><div id="sugg" class="small muted">Loading…</div>
    <h2>Listings</h2>
    ${rows.map(l => `<div class="check"><span><b>${esc(l.name)}</b><br><span class="fine">${esc(l.city)}, ${catOf(l.cat).label}${l.status === 'hidden' ? ', hidden' : ''}${l.checked ? ', checked ' + prettyDate(l.checked) : ''}</span></span><button class="chip" onclick="go('admin_edit',{id:'${esc(l.id)}'})">Edit</button></div>`).join('')}`};
}
async function loadSuggestions(){
  const el = $('#sugg'); if (!el) return;
  if (!dbx) { el.textContent = 'Not available in this view.'; return; }
  try {
    const snap = await dbx.collection('suggestions').orderBy('at', 'desc').limit(50).get();
    el.innerHTML = snap.empty ? 'No suggestions yet.' : snap.docs.map(d => { const x = d.data() || {}; const u = safeUrl(x.url); return `<div class="check"><span><b>${esc(x.name)}</b>, ${esc(x.city)}<br><span class="fine">${esc(x.what)}${u ? ` <a href="${esc(u)}" target="_blank" rel="noopener">link</a>` : ''}</span></span><button class="x" onclick="dbx.collection('suggestions').doc('${esc(d.id)}').delete().then(loadSuggestions)" aria-label="Dismiss">✕</button></div>`; }).join('');
  } catch(e) { el.textContent = 'Could not load suggestions.'; }
}
const AF = [['name','Name'],['city','City'],['prov','Province'],['desc','Description'],['dates','Dates'],['schedule','Schedule'],['admission','Admission or price note'],['history','History and tradition (optional)'],['source','Source name'],['sourceUrl','Source link (https)'],['sourceUrl2','Second source link (optional)']];
function vAdminEdit(p){
  if (!isAdmin || !dbx) return {title:'Edit listing', html: empty('Not available', 'Open the app while signed in as an admin to edit listings.')};
  const l = p.id ? ((ALL_ROWS || []).find(x => x.id === p.id) || byId(p.id) || {}) : {cat:'LIGHTS', acat:'LIGHTS', season:'2026', status:'published', family:true};
  return {title: p.id ? 'Edit listing' : 'Add listing', html:`
    ${AF.map(([k, lb]) => (k === 'desc' || k === 'history') ? `<label class="l" for="a-${k}">${lb}</label><textarea class="field" id="a-${k}" rows="3">${esc(l[k] || '')}</textarea>` : `<label class="l" for="a-${k}">${lb}</label><input class="field" id="a-${k}" value="${esc(l[k] || '')}">`).join('')}
    <label class="l" for="a-cat">Section</label><select class="field" id="a-cat">${CATS.map(c => `<option value="${c.id}" ${l.cat === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
    <label class="l" for="a-acat">Activity type</label><select class="field" id="a-acat">${Object.entries(ACATS).map(([k, [lb]]) => `<option value="${k}" ${l.acat === k ? 'selected' : ''}>${lb}</option>`).join('')}</select>
    <label class="l" for="a-season">Dates are from</label><select class="field" id="a-season">${[['2026','2026 season'],['2025','2025 season'],['older','Older report'],['annual','Every year']].map(([k, lb]) => `<option value="${k}" ${l.season === k ? 'selected' : ''}>${lb}</option>`).join('')}</select>
    <label class="l" for="a-lat">Latitude, longitude</label><div style="display:flex;gap:8px"><input class="field" id="a-lat" inputmode="decimal" value="${l.lat ?? ''}"><input class="field" id="a-lng" inputmode="decimal" value="${l.lng ?? ''}"></div>
    <label class="l" for="a-price">Lowest price in ₱ (0 = free, blank = unknown)</label><input class="field" id="a-price" inputmode="decimal" value="${l.price ?? ''}">
    <div class="sw"><input type="checkbox" id="a-feat" ${l.featured ? 'checked' : ''}><label for="a-feat">Featured on Home</label></div>
    <div class="sw"><input type="checkbox" id="a-ver" ${l.verified ? 'checked' : ''}><label for="a-ver">Verified directly with the organizer</label></div>
    <div class="sw"><input type="checkbox" id="a-hide" ${l.status === 'hidden' ? 'checked' : ''}><label for="a-hide">Hide from users</label></div>
    <button class="btn block" onclick="saveListing('${esc(p.id || '')}')">Save listing</button>
    ${p.id ? `<button class="btn danger block" onclick="confirmSheet('Delete this listing?','It disappears for everyone.','Delete',()=>dbx.collection('listings').doc('${esc(p.id)}').delete().then(()=>{toast('Deleted');tab('home')}))">Delete listing</button>` : ''}
    <p class="fine">Saving stamps today as the checked date. Leave phone, price and dates blank rather than guessing.</p>`};
}
async function saveListing(id){
  const v = k => $('#a-' + k).value.trim();
  const lat = parseFloat(v('lat')), lng = parseFloat(v('lng')), pr = v('price');
  if (!v('name') || !v('city') || isNaN(lat) || isNaN(lng)) { toast('Name, city and coordinates are required.'); return; }
  if ((v('sourceUrl') && !safeUrl(v('sourceUrl'))) || (v('sourceUrl2') && !safeUrl(v('sourceUrl2')))) { toast('Source link must start with https://'); return; }
  const prev = id ? ((ALL_ROWS || []).find(x => x.id === id) || {}) : {};
  const data = {name:v('name'), city:v('city'), prov:v('prov'), desc:v('desc'), dates:v('dates') || null, schedule:v('schedule') || null, admission:v('admission') || null,
    history:v('history') || null, source:v('source'), sourceUrl:v('sourceUrl'), sourceUrl2:v('sourceUrl2') || null, cat:v('cat'), acat:v('acat'), season:v('season'), lat, lng, price: pr === '' ? null : (parseFloat(pr) || 0),
    featured:$('#a-feat').checked, verified:$('#a-ver').checked, status:$('#a-hide').checked ? 'hidden' : 'published',
    also: prev.also || [], family: prev.family ?? true, checked: todayISO()};
  try { await dbx.collection('listings').doc(id || ('l' + uid())).set(data); toast('Listing saved'); back(); }
  catch(e) { toast('Could not save: ' + (e && e.code ? e.code : 'error')); }
}

const VIEWS = {admin:vAdmin, admin_edit:vAdminEdit, home:vHome, discover:vDiscover, listing:vListing, my:vMy, activity:vActivity, add:vAdd, plan:vPlan, create:vCreate, greeting:vGreeting, gedit:vGEdit, gathering:vGathering, settings:vSettings};
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (nav.view === 'greeting') drawGreeting(); });
</script>
